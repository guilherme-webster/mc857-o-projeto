services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: f1-sim-backend
    ports:
      - "8000:8000"
    volumes:
      # ``Z`` gives private SELinux labels to bind mounts on Fedora/RHEL while
      # remaining accepted by Docker Compose on hosts without SELinux.
      - ./backend:/app:Z
      - ./src:/app/src:Z
      - ./scripts:/app/scripts:Z
      - ./data:/data:Z
      - ./tests/fixtures/trotman_v128_tracks_2025:/data/geometry:ro,Z
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/src
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  frontend-linux:
    image: f1-sim-frontend:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
    profiles:
      - linux
    depends_on:
      backend:
        condition: service_healthy
    init: true
    security_opt:
      - no-new-privileges:true
    user: ${LOCAL_UID:-1000}:${LOCAL_GID:-1000}
    environment:
      F1_API_BASE_URL: http://backend:8000
      PYTHONUNBUFFERED: "1"
      DISPLAY: ${DISPLAY:-:0}
      XAUTHORITY: /tmp/f1-sim-docker.xauth
      LIBGL_ALWAYS_SOFTWARE: ${LIBGL_ALWAYS_SOFTWARE:-1}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ${F1_XAUTHORITY:-/tmp/f1-sim-docker.xauth}:/tmp/f1-sim-docker.xauth:ro,Z

  frontend-wslg:
    image: f1-sim-frontend:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
    profiles:
      - wslg
    depends_on:
      backend:
        condition: service_healthy
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      F1_API_BASE_URL: http://backend:8000
      PYTHONUNBUFFERED: "1"
      DISPLAY: ${DISPLAY:-:0}
      LIBGL_ALWAYS_SOFTWARE: ${LIBGL_ALWAYS_SOFTWARE:-1}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
