[project]
name = "f1-sim_-frontend"
version = "0.1.0"
description = "Frontend Arcade para o simulador de F1"
requires-python = ">=3.12"
dependencies = [
    "arcade>=3.3.3",
    "matplotlib>=3.11.2",
]

[project.scripts]
simulador = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["TOBEDEFINED"]