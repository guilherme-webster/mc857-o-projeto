name: Enforce develop to main PR

on:
  pull_request:
    branches:
      - main

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Verify head branch is develop
        if: github.head_ref != 'develop'
        run: |
          echo "AVISO: Pull Request para 'main' com origem diferente de 'develop'."
          echo "Branch de origem recebida: ${{ github.head_ref }}"

      - name: Success message
        if: github.head_ref == 'develop'
        run: echo "Origem válida (develop -> main). Pronto para revisão."